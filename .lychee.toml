# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# 403/429 from rate limiting are not broken links; everything else outside 2xx is.
accept = ["200..=299", "403", "429"]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
]

# The READMEs link to this repository's own files on main (graphics in .github/brand, screenshots
# in docs/images, Package.swift, LICENSE, folders). A pull request cannot change main, so the
# checked-out files stand in for them: on main they are the same files, on a pull request they are
# the ones it adds or removes. The path is the workspace of GitHub-hosted runners; a local run
# passes the same remap options with its own path.
remap = [
  '^https://raw\.githubusercontent\.com/muhittincamdali/SwiftIntelligence/main/(.*)$ file:///home/runner/work/SwiftIntelligence/SwiftIntelligence/$1',
  '^https://github\.com/muhittincamdali/SwiftIntelligence/(?:blob|tree)/main/(.*)$ file:///home/runner/work/SwiftIntelligence/SwiftIntelligence/$1',
  # The article pages on GitHub Pages are built from the .docc articles by docs.yml after a push
  # to main, so a pull request that adds an article links to a page that is not online yet. Each
  # article URL is checked against its source file instead; the documentation root stays a live
  # check, so a site that is down still fails.
  '^https://muhittincamdali\.github\.io/SwiftIntelligence/documentation/swiftintelligence/gettingstarted$ file:///home/runner/work/SwiftIntelligence/SwiftIntelligence/Sources/SwiftIntelligence/SwiftIntelligence.docc/GettingStarted.md',
  '^https://muhittincamdali\.github\.io/SwiftIntelligence/documentation/swiftintelligence/searchingdocuments$ file:///home/runner/work/SwiftIntelligence/SwiftIntelligence/Sources/SwiftIntelligence/SwiftIntelligence.docc/SearchingDocuments.md',
  '^https://muhittincamdali\.github\.io/SwiftIntelligence/documentation/swiftintelligence/answeringquestions$ file:///home/runner/work/SwiftIntelligence/SwiftIntelligence/Sources/SwiftIntelligence/SwiftIntelligence.docc/AnsweringQuestions.md',
  '^https://muhittincamdali\.github\.io/SwiftIntelligence/documentation/swiftintelligence/redactingpersonaldata$ file:///home/runner/work/SwiftIntelligence/SwiftIntelligence/Sources/SwiftIntelligence/SwiftIntelligence.docc/RedactingPersonalData.md',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
]
